[project]
name = "remote-sensing-semantic-segmentation"
version = "0.1.0"
description = "A remote sensing semantic segmentation project."
readme = "README.md"
authors = [
    { name = "Maël Dacher", email = "mael.dacher.90@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.5.4",
    "pytorch-lightning>=2.6.6",
    "rasterio>=1.5.2",
    "scikit-image>=0.26.0",
    "torch>=2.14.1",
]

[project.scripts]
remote-sensing-semantic-segmentation = "remote_sensing_semantic_segmentation:main"

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pre-commit>=4.7.0",
    "pytest>=9.1.1",
    "ruff>=0.17.0",
    "ty>=0.0.87",
]
