# Training recipe for the shared segmentation module.
#
# model       : forwarded to rsss.models.build_model ("name" plus its kwargs).
# num_classes : classes shared by the model head and the metrics (FLAIR = 13).
# loss        : weights of the cross-entropy and Dice terms.
# optimizer   : AdamW settings.
# scheduler   : warmup-then-cosine; `t_max` defaults to `trainer.max_epochs`.
# trainer     : Lightning Trainer settings.
# datamodule  : FlairDatamodule settings; the data source itself lives in
#               configs/data.yaml (data_dir here would be rejected).
model:
  name: unet
  encoder_name: resnet34
  encoder_weights: imagenet
  in_channels: 5

num_classes: 13

loss:
  ce: 0.5
  dice: 0.5

optimizer:
  lr: 3.0e-4
  weight_decay: 1.0e-4

scheduler:
  warmup_epochs: 1

trainer:
  max_epochs: 30
  accelerator: auto
  devices: 1
  precision: 16-mixed
  log_every_n_steps: 10

datamodule:
  # Sized for one PANDO V100 (32 GB) and the job's --cpus-per-task=8: batch 4
  # over 512x512 tiles fits in mixed precision. Lower the batch size if a run
  # ever reports CUDA out of memory.
  batch_size: 4
  num_workers: 8
  # FLAIR#1's official normalization: per-band mean/std over the raw 0..255
  # values, as used by the IGN baseline. 'scaling' (divide by 255) is only
  # appropriate for a backbone trained on [0, 1] inputs.
  norm_type: custom
  means: [105.08, 110.87, 101.82, 106.38, 53.26]
  stds: [52.17, 45.38, 44.0, 39.69, 79.3]
