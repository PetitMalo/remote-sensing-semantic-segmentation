# Data source for the subset run on PANDO, whose 25 GiB session cannot hold the
# full FLAIR#1 tree (95 GiB extracted, ~146 GiB free at peak).
#
# The subset keeps whole spatial domains, alphabetically first per split: the
# first 3 train domains (5,275 tiles), the first 2 validation domains (3,550) and
# the first 2 test domains (2,250) -- 11,075 tiles and 13.6 GiB, fetched tile by
# tile from IGN's archives, so no archive is ever staged. It is staged with
# `python -m rsss.data.download --dataset flair_1_subset` (add --report-only to
# size it first, and --num-domains TRAIN,VALIDATION,TEST to change the recipe).
#
# data_dir : directory datasets are assembled under (the repo's `data/`).
# dataset  : key into rsss.data.download.DATASETS.
# download : fetch the missing tiles and split CSVs when missing.
data_dir: data
dataset: flair_1_subset
download: true
